name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Ruby syntax
        run: ruby tools/check_syntax.rb
      - name: Test BSP solid geometry
        run: ruby tests/bsp_test.rb
      - name: Test reentry guard
        run: ruby tests/entrypoint_test.rb
      - name: Test geometry bounds guard
        run: ruby tests/bounds_test.rb
      - name: Test reproducible RBZ packaging
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build RBZ
        run: python tools/package.py
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from package import version
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version(), 'Tag/version mismatch'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rbz-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compare platform artifacts and prepare release
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, sys
          sys.path.insert(0, 'tools')
          from package import version
          name = 'super-combine-' + version() + '.rbz'
          mac = pathlib.Path('artifacts/rbz-macos-latest')
          win = pathlib.Path('artifacts/rbz-windows-latest')
          assert (mac/name).read_bytes() == (win/name).read_bytes(), 'Platform RBZ mismatch'
          assert (mac/'SHA256SUMS.txt').read_bytes() == (win/'SHA256SUMS.txt').read_bytes(), 'Checksum mismatch'
          out = pathlib.Path('release-assets'); out.mkdir()
          for filename in [name, 'SHA256SUMS.txt']: shutil.copyfile(mac/filename, out/filename)
          tag = os.environ['GITHUB_REF_NAME']
          notes = pathlib.Path('docs/releases/' + tag + '.md').read_text()
          notes += '\n\nCI: ' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n'
          pathlib.Path('release-notes.md').write_text(notes)
          PY
      - name: Publish RBZ and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "超级组合 $GITHUB_REF_NAME" --notes-file release-notes.md
