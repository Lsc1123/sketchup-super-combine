name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish after validation (optional)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Ruby syntax
        run: ruby tools/check_syntax.rb
      - name: Test BSP solid geometry
        run: ruby tests/bsp_test.rb
      - name: Test reentry guard
        run: ruby tests/entrypoint_test.rb
      - name: Test geometry bounds guard
        run: ruby tests/bounds_test.rb
      - name: Test reproducible RBZ packaging
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build RBZ
        run: python tools/package.py
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from package import version
          assert os.environ['RELEASE_TAG'] == 'v' + version(), 'Tag/version mismatch'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rbz-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compare platform artifacts and prepare release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, sys
          sys.path.insert(0, 'tools')
          from package import version
          name = 'super-combine-' + version() + '.rbz'
          mac = pathlib.Path('artifacts/rbz-macos-latest')
          win = pathlib.Path('artifacts/rbz-windows-latest')
          assert (mac/name).read_bytes() == (win/name).read_bytes(), 'Platform RBZ mismatch'
          checksum = hashlib.sha256((mac/name).read_bytes()).hexdigest() + '  ' + name + '\n'
          for source in [mac, win]:
              assert (source/'SHA256SUMS.txt').read_text() == checksum, 'Checksum mismatch'
          out = pathlib.Path('release-assets'); out.mkdir()
          shutil.copyfile(mac/name, out/name)
          (out/'SHA256SUMS.txt').write_bytes(checksum.encode('ascii'))
          tag = os.environ['RELEASE_TAG']
          notes = pathlib.Path('docs/releases/' + tag + '.md').read_text()
          notes += '\n\nCI: ' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n'
          pathlib.Path('release-notes.md').write_text(notes)
          PY
      - name: Publish RBZ and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "超级组合 $RELEASE_TAG" --notes-file release-notes.md
